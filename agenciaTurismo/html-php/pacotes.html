        <link rel="stylesheet" href="../CSS/stylesheet.css">
        <link rel="stylesheet" href="../CSS/styleForm.css">
    </head>
    <body>
        <!--Topo do site-->
        <div class="topo">
            <h1>Agência de Turismo</h1>
            <div class="usuario">
                <h4>Funcionário</h4>
                <img src="../Icones/person-circle.svg" alt="user">
            </div>
        </div>
        <div id="main">
            <!--Lateral do site-->
            <div class="lado">
                <img src="../Icones/grid-fill.svg" alt="grid"><a href="main.html">Menu</a><br><br>
                <img src="../Icones/person-fill.svg" alt="person"><a href="cliente.html">Clientes</a><br><br>
                <img src="../Icones/airplane-fill.svg" alt="airplane"><a href="viagem.html">Viagens</a><br><br>
                <img src="../Icones/suitcase2-fill.svg" alt="suitcase"><a href="pacotes.html">Pacotes</a><br><br>
                <img src="../Icones/calendar-check.svg" alt="calendar"><a href="reserva.html">Reservas</a><br><br>
                <img src="../Icones/currency-dollar.svg" alt="money"><a href="pagar.html">Pagamentos</a><br><br>
                <img src="../Icones/clipboard-fill.svg" alt="clipboard"><a href="relatorios.html">Relatórios</a>
            </div>
            <div class="meioForm">
                <h1>Pacotes</h1>
                <!--Formulário-->
                <form method="post" class="cadastrar">
                    <div class="organForm">
                        <label>ID Viagem</label>
                        <input type="number" name="idViagem">
                    </div>
                    <div class="organForm">
                        <label>Nome</label>
                        <input type="text" name="nomePacote">
                    </div>
                    <div class="organForm">
                        <label>Descrição</label>
                        <input type="text" name="desc">
                    </div>
                    <div class="organForm">
                        <label>Preço</label>
                        <input type="number" name="precoPacote">
                    </div>
                    <div class="organForm">
                        <label>Beneficios</label>
                        <input type="text" name="beneficios">
                    </div>
                    <button type="submit">Enviar</button>
                </form>
                <hr>
                <div class="gerenciar">
                    <h1>Lista de Pacotes</h1>
                    <!--Aqui colocar uma lista dos pacotes já cadastrados e um método de pesquisa-->
                </div>
            </div>
        </div>
        <!--Rodapé-->
        <div class="rodape">
