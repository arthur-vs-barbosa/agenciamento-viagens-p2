<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Cliente</title>
        <link rel="stylesheet" href="../CSS/stylesheet.css">
        <link rel="stylesheet" href="../CSS/styleForm.css">
    </head>
    <body>
        <div id="main">
            <!--Lateral do site-->
            <div class="lado">
                <h3>Agência de Turismo</h3>
                <img src="../Icones/grid-fill.svg" alt="grid"><a href="main.html">Menu</a><br><br>
                <img src="../Icones/person-fill.svg" alt="person"><a href="cliente.html">Clientes</a><br><br>
                <img src="../Icones/airplane-fill.svg" alt="airplane"><a href="viagem.html">Viagens</a><br><br>
                <img src="../Icones/suitcase2-fill.svg" alt="suitcase"><a href="pacotes.html">Pacotes</a><br><br>
                <img src="../Icones/calendar-check.svg" alt="calendar"><a href="reserva.html">Reservas</a><br><br>
                <img src="../Icones/currency-dollar.svg" alt="money"><a href="pagar.html">Pagamentos</a><br><br>
                <img src="../Icones/clipboard-fill.svg" alt="clipboard"><a href="relatorios.html">Relatórios</a>
            </div>
            <div class="meioForm">
                    <h1>Cadastrar Cliente</h1>
                    <form method="post" class="cadastrar">
                        <div class="organForm">
                            <label>Nome</label>
                            <input type="text" name="nome">
                        </div>
                        <div class="organForm">
                            <label>CPF</label>
                            <input type="number" name="cpf">
                        </div>
                        <div class="organForm">
                            <label>Email</label>
                            <input type="email" name="email">
                        </div>
                        <div class="organForm">
                            <label>Celular</label>
                            <input type="tel" name="celular">
                        </div>
                        <button type="submit">Cadastrar</button>
                    </form>
                <hr>
                <div class="gerenciar">
                    <h1>Clientes Cadastrados</h1>
                </div>
            </div>
        </div>
        <!--Rodapé-->
        <div class="rodape">
            <p>Site realizado para o projeto proposto na disciplina de Desenvolvimento Web II</p>
        </div>
    </body>
</html>
